title                    : "Wenyuan Xie | Robotics & Embodied AI"
description              : "Wenyuan Xie — working on embodied intelligence, vision-language-action models, navigation, and robot manipulation."
repository               : "BorisXwy/BorisXwy.github.io"
google_scholar_stats_use_cdn : false

google_analytics_id      :

author:
  name             : "Wenyuan Xie (谢文远)"
  avatar           : "images/wenyuan-xie.png"
  bio              : "Embodied AI & Robotics"
  location         : "Shanghai, China"
  employer         : "Shanghai Jiao Tong University"
  googlescholar    :
  email            : "wenyuan.xie2002@gmail.com"
  github           : "BorisXwy"
  linkedin         :
  twitter          :
  dblp             :
  orcid            :

include:
  - .htaccess
  - _pages
  - files
exclude:
  - docs
  - google_scholar_crawler
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - .github
  - CHANGELOG
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README
  - Rakefile
  - node_modules
  - vendor
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true
permalink: /:categories/:title/
timezone: Asia/Shanghai
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jemoji
compress_html:
  clippings: all
  ignore:
    envs: development
